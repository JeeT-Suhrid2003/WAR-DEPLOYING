name: Package WAR for Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare WAR file
        run: |
          jar -cvf testapp.war index.html WEB-INF

      - name: Upload WAR artifact
        run: mkdir -p staging && cp testapp.war staging/

      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}
