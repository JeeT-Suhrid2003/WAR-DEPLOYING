name: Package WAR for Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare WAR file
        run: |
          jar -cvf testapp.war index.html WEB-INF

      - name: Upload WAR artifact
        run: mkdir -p staging && cp testapp.war staging/

      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/app:${{ github.run_number }}

      - name: Update deployment image tag
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          sed -i -E "s|^([[:space:]]*-[[:space:]]*image: ).*|\\1${DOCKERHUB_USERNAME}/app:${IMAGE_TAG}|" deployment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment.yml
          if git diff --cached --quiet; then
            echo "Deployment already references this image tag"
            exit 0
          fi
          git commit -m "Deploy app image ${IMAGE_TAG}"
          git push origin HEAD:main
